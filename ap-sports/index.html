<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AP Sports — Work, amplified</title>
<meta name="description" content="Activewear para entrenar y seguir el día. Lanzamiento muy pronto.">
<meta property="og:title" content="AP Sports — Work, amplified">
<meta property="og:description" content="Activewear para entrenar y seguir el día. Lanzamiento muy pronto.">
<meta property="og:image" content="portada.jpg">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23121212'/%3E%3Ctext x='32' y='42' font-family='Helvetica,Arial' font-size='26' fill='%23fff' text-anchor='middle' letter-spacing='1'%3EAP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
  :root{
    --night:#121212; --gray:#828C8E; --smoke:#F3F3F3; --white:#FFFFFF;
    --line:rgba(243,243,243,.22);
    --font:'Questrial',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--night);color:var(--smoke);
    font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .wrap{height:100dvh;display:grid;grid-template-columns:1.05fr 1fr}
  @media (max-width:860px){
    body{overflow:auto}
    .wrap{height:auto;grid-template-columns:1fr}
  }

  /* ---------- imagen ---------- */
  .art{position:relative;background:#1a1a1a;overflow:hidden}
  .art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
  @media (max-width:860px){.art{aspect-ratio:4/5}}

  /* ---------- contenido ---------- */
  .panel{
    display:flex;flex-direction:column;justify-content:center;gap:clamp(1rem,1.8vh,1.5rem);
    padding:clamp(1.6rem,3.5vh,2.6rem) clamp(1.5rem,3.5vw,3rem);
    overflow:hidden;
  }
  .panel > *{max-width:25rem;width:100%}
  .mark{
    font-size:.68rem;letter-spacing:.4em;text-transform:uppercase;color:var(--white);margin:0;
  }
  h1{
    margin:.4rem 0 0;font-weight:400;letter-spacing:-.015em;
    font-size:clamp(2.1rem, 1.1vw + 2.2vh, 3.1rem);line-height:1.02;color:var(--white);
  }
  .lede{margin:.6rem 0 0;max-width:36ch;font-size:.92rem;color:var(--smoke);text-wrap:balance}
  .soon{
    margin:.7rem 0 0;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gray);
  }

  /* ---------- formulario ---------- */
  form{display:flex;flex-direction:column;gap:.8rem;max-width:24rem;width:100%}
  .field{display:flex;flex-direction:column;gap:.15rem}
  label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
  input,select{
    font-family:var(--font);font-size:.92rem;color:var(--white);
    background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:.35rem 0;border-radius:0;appearance:none;
  }
  select{background-image:linear-gradient(transparent,transparent)}
  option{color:#111}
  input:focus-visible,select:focus-visible{outline:none;border-bottom-color:var(--white)}
  input::placeholder{color:rgba(243,243,243,.35)}

  .consent{display:flex;gap:.6rem;align-items:flex-start;font-size:.72rem;color:var(--gray);line-height:1.4;text-transform:none;letter-spacing:0;margin-top:.2rem}
  .consent input{
    appearance:none;width:.95rem;height:.95rem;flex:0 0 auto;margin-top:.1rem;
    border:1px solid var(--line);background:transparent;border-radius:0;padding:0;
  }
  .consent input:checked{background:var(--white);border-color:var(--white)}
  .consent a{color:var(--smoke)}

  button{
    font-family:var(--font);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
    background:var(--white);color:var(--night);border:0;padding:.8rem 1.3rem;cursor:pointer;
    margin-top:.2rem;transition:opacity .15s ease;
  }
  button:hover{opacity:.86}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--white);outline-offset:3px}

  .msg{font-size:.76rem;color:var(--gray);min-height:1em;margin:0}
  .msg.err{color:#E5A3A3}
  .msg a{color:var(--white);text-underline-offset:3px;cursor:pointer}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  input[aria-invalid="true"],select[aria-invalid="true"]{border-bottom-color:#E5A3A3}

  /* ---------- gracias ---------- */
  .done{display:none;flex-direction:column;gap:.9rem;max-width:24rem}
  .done h2{margin:0;font-weight:400;font-size:clamp(1.3rem,2.2vw,1.8rem);color:var(--white);line-height:1.1}
  .done a.ig{
    align-self:flex-start;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--night);background:var(--white);padding:.8rem 1.25rem;text-decoration:none;
  }
  body.sent form{display:none}
  body.sent .done{display:flex}

  footer{
    display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.7rem;color:var(--gray);
    padding-top:.9rem;border-top:1px solid var(--line);
  }
  footer a{color:var(--gray);text-decoration:none}
  footer a:hover{color:var(--smoke)}
  .preview{font-size:.68rem;color:#E5C08A;letter-spacing:.04em;margin:.1rem 0 0}
  /* ventana horizontal baja: se aprieta para entrar sin scroll */
  @media (min-width:861px) and (max-height:880px){
    .panel{gap:1.05rem;padding-block:1.2rem}
    .lede{font-size:.86rem;margin-top:.45rem}
    .soon{margin-top:.55rem}
    form{gap:.6rem}
    input,select{padding:.28rem 0;font-size:.88rem}
    button{padding:.7rem 1.2rem}
    footer{padding-top:.7rem}
  }
  @media (min-width:861px) and (max-height:720px){
    .panel{gap:.6rem}
    .lede{display:none}
    form{gap:.5rem}
    label{font-size:.56rem}
  }

  /* vertical */
  @media (max-width:860px){
    h1{font-size:clamp(2.2rem,8vw,2.9rem)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="art">
    <img src="portada.jpg" alt="Modelo con conjunto de AP Sports en exterior">
  </div>

  <div class="panel">
    <div>
      <p class="mark">AP Sports</p>
      <h1>Work,<br>amplified.</h1>
      <p class="lede">Activewear para entrenar y seguir el día.</p>
      <p class="soon">Lanzamiento muy pronto</p>
    </div>

    <form id="f" novalidate autocomplete="on">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="name" type="text" autocomplete="name"
               autocapitalize="words" enterkeyhint="next" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
               enterkeyhint="next" required>
      </div>
      <div class="field">
        <label for="whatsapp">WhatsApp <span style="text-transform:none;letter-spacing:0">(opcional)</span></label>
        <input id="whatsapp" name="tel" type="tel" autocomplete="tel"
               inputmode="tel" enterkeyhint="next" placeholder="300 123 4567">
      </div>
      <div class="field">
        <label for="ciudad">Ciudad</label>
        <select id="ciudad" name="ciudad" autocomplete="address-level2" required>
          <option value="" selected>Elige una</option>
          <option value="bogota">Bogotá</option>
          <option value="medellin">Medellín</option>
          <option value="otra-colombia">Otra en Colombia</option>
          <option value="exterior">Fuera de Colombia</option>
        </select>
      </div>

      <input class="hp" type="text" id="empresa" name="empresa" tabindex="-1" autocomplete="off" aria-hidden="true">

      <label class="consent" for="datos">
        <input id="datos" name="datos" type="checkbox">
        <span>Autorizo a AP Sports a tratar mis datos para avisarme del lanzamiento, según su <a href="../politica-de-datos/">política de datos</a>.</span>
      </label>

      <button id="btn" type="submit" enterkeyhint="done">Avísame del lanzamiento</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>

    <div class="done" id="done">
      <h2>Listo. Te avisamos primero.</h2>
      <a class="ig" href="https://instagram.com/" target="_blank" rel="noopener">Seguir en Instagram</a>
    </div>

    <footer>
      <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="../politica-de-datos/">Política de datos</a>
    </footer>
  </div>
</div>

<script>
// ----- Configuración: llenar antes de publicar -----
const CONFIG = {
  SUPABASE_URL: "https://ajczmdqkvjjoneeuuxpm.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqY3ptZHFrdmpqb25lZXV1eHBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NjUwMDksImV4cCI6MjEwNTI0MTAwOX0.w0fdrl3v8-YRvwxrXEWCPcR6z4m5wgsonHqhOCGsH30",  // pública: solo puede insertar
  META_PIXEL_ID: "",      // opcional
  PROYECTO: "ap-sports"
};

const q = new URLSearchParams(location.search);
const SRC = {
  utm_source:   q.get("utm_source")   || (document.referrer ? new URL(document.referrer).hostname : "directo"),
  utm_medium:   q.get("utm_medium")   || "",
  utm_campaign: q.get("utm_campaign") || ""
};

// ----- Los 5 eventos: acá aplican visit, lead y source -----
window.dataLayer = window.dataLayer || [];
function track(evento, extra){
  window.dataLayer.push(Object.assign({event: evento, source: SRC.utm_source, proyecto: CONFIG.PROYECTO}, extra||{}));
  if (window.fbq) fbq("trackCustom", evento, {source: SRC.utm_source});
}

if (CONFIG.META_PIXEL_ID){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.META_PIXEL_ID); fbq('track','PageView');
}
track("visit");

const form = document.getElementById("f");
const btn  = document.getElementById("btn");
const msg  = document.getElementById("msg");
const T0   = Date.now();

if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY){
  const p = document.createElement("p");
  p.className = "preview";
  p.textContent = "Vista previa: el formulario todavía no guarda datos.";
  form.appendChild(p);
}

// ----- errores de escritura frecuentes en el dominio -----
const TYPOS = {
  "gmial.com":"gmail.com","gmai.com":"gmail.com","gmail.co":"gmail.com","gnail.com":"gmail.com",
  "gmail.cm":"gmail.com","gmailcom":"gmail.com","hotmial.com":"hotmail.com","hotmai.com":"hotmail.com",
  "hotmail.co":"hotmail.com","hotmal.com":"hotmail.com","outlok.com":"outlook.com",
  "outlook.co":"outlook.com","yahho.com":"yahoo.com","yaho.com":"yahoo.com","icloud.co":"icloud.com"
};

const limpiar = (t) => t.replace(/\s+/g, " ").trim();

function marcar(campo, texto, sugerencia){
  msg.className = "msg err";
  msg.textContent = texto + " ";
  if (sugerencia){
    const a = document.createElement("a");
    a.textContent = sugerencia.texto;
    a.setAttribute("role","button"); a.tabIndex = 0;
    const fix = () => { sugerencia.aplicar(); msg.className="msg"; msg.textContent=""; campo.setAttribute("aria-invalid","false"); };
    a.addEventListener("click", fix);
    a.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") fix(); });
    msg.appendChild(a);
  }
  campo.setAttribute("aria-invalid","true");
  campo.focus();
  btn.disabled = false;
  return false;
}

// ----- telefono: acepta 10 digitos de Colombia o formato internacional -----
function normalizarTel(valor){
  const v = valor.replace(/[\s().-]/g, "");
  if (!v) return {ok:true, valor:null};
  if (!/^\+?\d+$/.test(v)) return {ok:false, error:"El WhatsApp solo lleva números."};
  const d = v.replace(/^\+/, "");
  if (/^3\d{9}$/.test(d))        return {ok:true, valor:"+57" + d};
  if (/^57(3\d{9})$/.test(d))    return {ok:true, valor:"+" + d};
  if (v.startsWith("+") && d.length >= 8 && d.length <= 15) return {ok:true, valor:"+" + d};
  if (/^\d{10}$/.test(d))        return {ok:false, error:"En Colombia el celular empieza por 3."};
  return {ok:false, error:"Revisa el número. Si es de otro país, ponlo con +."};
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg"; msg.textContent = "";
  ["nombre","email","whatsapp","ciudad"].forEach(id => document.getElementById(id).setAttribute("aria-invalid","false"));

  const fNombre = document.getElementById("nombre");
  const fEmail  = document.getElementById("email");
  const fTel    = document.getElementById("whatsapp");
  const fCiudad = document.getElementById("ciudad");

  const nombre = limpiar(fNombre.value);
  const email  = fEmail.value.trim().toLowerCase();
  const ciudad = fCiudad.value;

  // nombre
  if (nombre.length < 2) return marcar(fNombre, "Escribe tu nombre.");
  if (!/^[\p{L}\p{M}][\p{L}\p{M}\s'.-]*$/u.test(nombre)) return marcar(fNombre, "El nombre solo lleva letras.");

  // email
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) return marcar(fEmail, "Revisa el email: falta el @ o el dominio.");
  const dominio = email.split("@")[1];
  if (TYPOS[dominio]){
    const arreglado = email.split("@")[0] + "@" + TYPOS[dominio];
    return marcar(fEmail, "¿Quisiste decir " + TYPOS[dominio] + "?",
      {texto:"Corregir", aplicar:() => { fEmail.value = arreglado; }});
  }

  // telefono
  const tel = normalizarTel(fTel.value);
  if (!tel.ok) return marcar(fTel, tel.error);

  if (!ciudad) return marcar(fCiudad, "Elige una ciudad.");
  if (!form.datos.checked) return marcar(document.getElementById("datos"), "Necesitamos tu autorización para escribirte.");

  // campo trampa y envio demasiado rapido: bots
  const bot = document.getElementById("empresa").value !== "" || (Date.now() - T0) < 2500;

  const lead = {
    nombre, email, ciudad,
    whatsapp: tel.valor,
    utm_source: SRC.utm_source,
    utm_medium: SRC.utm_medium,
    utm_campaign: SRC.utm_campaign,
    autoriza_datos: true
  };

  if (bot || !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY){
    track("lead", {modo: bot ? "descartado" : "vista-previa"});
    document.body.classList.add("sent");
    return;
  }

  btn.disabled = true; msg.textContent = "Enviando...";
  try {
    const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/leads", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": CONFIG.SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(lead)
    });
    if (r.status === 409){           // ya registrado
      track("lead", {modo: "repetido"});
      document.body.classList.add("sent");
      return;
    }
    if (!r.ok) throw new Error(r.status + " " + await r.text());
    track("lead");
    document.body.classList.add("sent");
  } catch (err) {
    console.error(err);
    msg.className = "msg err";
    msg.textContent = "No se pudo enviar. Intenta de nuevo en un momento.";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
