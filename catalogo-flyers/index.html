<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FLYERS EVENTOS · GROWTH*Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
  :root{--bg:#0A0A0A;--ink:#F4F4F2;--soft:#A3A3A0;--line:#2C2C2C;--acc:#B7FF06;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Inter Tight',Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden}
  body.abierto{overflow:hidden}

  /* fondo: resplandor que respira, como la referencia */
  .glow{position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:radial-gradient(40% 35% at 30% 30%,rgba(183,255,6,.10),transparent 70%),
               radial-gradient(45% 40% at 75% 70%,rgba(120,90,255,.16),transparent 70%);
    animation:respira 14s ease-in-out infinite alternate}
  @keyframes respira{to{transform:translate3d(3%,-3%,0) scale(1.08)}}

  header{position:relative;z-index:2;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
    padding:clamp(20px,4vw,44px) clamp(16px,4vw,48px) 0}
  .eyebrow{display:inline-block;background:var(--acc);color:#0A0A0A;font-size:11px;font-weight:700;letter-spacing:.16em;padding:3px 8px;margin:0 0 10px}
  h1{font-size:clamp(34px,7vw,84px);font-weight:800;line-height:.92;letter-spacing:-.03em;margin:0;text-transform:uppercase}
  .logo{display:block;height:clamp(16px,2vw,22px);width:auto;margin:0 0 14px}

  /* esfera de flyers: las posiciones las calcula el script en cada cuadro */
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .campo{position:fixed;inset:0;z-index:1;touch-action:none;cursor:grab}
  .campo.arrastrando{cursor:grabbing}
  .flyer{all:unset;cursor:pointer;position:absolute;left:50%;top:50%;width:var(--w);margin-left:calc(var(--w)/-2);
    transition:scale .25s;will-change:transform,opacity;-webkit-tap-highlight-color:transparent}
  .flyer img{display:block;width:100%;height:auto;border-radius:10px;background:#161616;pointer-events:none;
    box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
  .flyer .num{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;letter-spacing:.12em;background:rgba(10,10,10,.72);
    padding:3px 6px;border-radius:4px}
  .flyer .mas{position:absolute;right:8px;top:8px;font-size:10px;font-weight:700;background:var(--acc);color:#0A0A0A;padding:3px 6px;border-radius:4px}
  .flyer:hover{scale:1.1}
  .flyer:focus-visible img{outline:2px solid var(--acc);outline-offset:4px}

  /* tarjeta */
  .velo{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(6,6,6,.78);backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .15s;perspective:1400px;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .velo.on{opacity:1;pointer-events:auto}
  .tarjeta{position:relative;height:min(78vh,820px);max-width:calc(100vw - 32px);aspect-ratio:var(--ar,4/5);border-radius:18px;overflow:hidden;background:#111;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,.92));transform-style:preserve-3d;
    transition:transform .18s ease-out,aspect-ratio .25s ease;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);will-change:transform}
  .velo.on .tarjeta{--sc:1}
  @media (max-aspect-ratio:3/4){.tarjeta{height:auto;width:min(calc(100vw - 32px),520px)}}
  .tarjeta .pieza{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
  .tarjeta .pieza.on{opacity:1}
  .brillo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:var(--go,0);transition:opacity .3s;
    background:radial-gradient(60% 50% at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),transparent 70%)}
  .pie{position:fixed;z-index:11;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .35s}
  .velo.on ~ .pie{opacity:1;pointer-events:auto}
  .pie .txt{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .puntos{display:flex;gap:6px}
  .puntos button{all:unset;cursor:pointer;width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
  .puntos button.on::after{content:"";position:absolute;inset:0;background:var(--acc);transform-origin:left;animation:llena var(--t,3s) linear forwards}
  .puntos button.hecho{background:var(--acc)}
  @keyframes llena{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .ctrl{all:unset;cursor:pointer;position:fixed;z-index:12;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:18px;opacity:0;pointer-events:none;transition:opacity .35s,background .2s}
  .velo.on ~ .ctrl{opacity:1;pointer-events:auto}
  .ctrl:hover{background:rgba(255,255,255,.18)} .ctrl:focus-visible{outline:2px solid var(--acc)}
  #cerrar{top:max(16px,env(safe-area-inset-top));right:16px}
  #ant{left:16px;top:50%;transform:translateY(-50%)} #sig{right:16px;top:50%;transform:translateY(-50%)}
  @media (max-width:640px){#ant,#sig{top:auto;bottom:max(64px,calc(env(safe-area-inset-bottom) + 64px));transform:none}}
  @media (prefers-reduced-motion:reduce){.glow{animation:none}.tarjeta{transition:none}}
</style>
</head>
<body>
<div class="glow"></div>
<header>
  <div><img class="logo" src="media/gs-logo.png" alt="GROWTH*Stars" width="640" height="87"><h1>Flyers<br>eventos</h1></div>
</header>
<main class="campo" id="campo"></main>

<div class="velo" id="velo"><div class="tarjeta" id="tarjeta"><div class="brillo"></div></div></div>
<div class="pie"><span class="txt" id="rotulo"></span><div class="puntos" id="puntos"></div></div>
<button class="ctrl" id="cerrar" aria-label="Cerrar">✕</button>
<button class="ctrl" id="ant" aria-label="Evento anterior">←</button>
<button class="ctrl" id="sig" aria-label="Evento siguiente">→</button>

<script>
const EVENTOS = [{"n":"01","s":[{"t":"img","src":"media/e01-2.webp","th":"media/e01-2-t.webp","w":1170,"h":1456},{"t":"vid","src":"media/e01-1.mp4","th":"media/e01-1-t.webp","w":720,"h":896}]},{"n":"02","s":[{"t":"img","src":"media/e02-1.webp","th":"media/e02-1-t.webp","w":1400,"h":1750},{"t":"vid","src":"media/e02-2.mp4","th":"media/e02-2-t.webp","w":720,"h":900}]},{"n":"03","s":[{"t":"vid","src":"media/e03-1.mp4","th":"media/e03-1-t.webp","w":720,"h":900}]},{"n":"04","s":[{"t":"img","src":"media/e04-1.webp","th":"media/e04-1-t.webp","w":1353,"h":1800},{"t":"vid","src":"media/e04-2.mp4","th":"media/e04-2-t.webp","w":720,"h":958}]},{"n":"05","s":[{"t":"img","src":"media/e05-1.webp","th":"media/e05-1-t.webp","w":1400,"h":1750}]},{"n":"06","s":[{"t":"vid","src":"media/e06-2.mp4","th":"media/e06-2-t.webp","w":720,"h":900},{"t":"img","src":"media/e06-1.webp","th":"media/e06-1-t.webp","w":1170,"h":1463}]},{"n":"07","s":[{"t":"vid","src":"media/e07-1.mp4","th":"media/e07-1-t.webp","w":720,"h":900}]},{"n":"08","s":[{"t":"img","src":"media/e08-3.webp","th":"media/e08-3-t.webp","w":1400,"h":1750},{"t":"img","src":"media/e08-1.webp","th":"media/e08-1-t.webp","w":1400,"h":1750},{"t":"img","src":"media/e08-2.webp","th":"media/e08-2-t.webp","w":1400,"h":1750}]},{"n":"09","s":[{"t":"vid","src":"media/e09-1.mp4","th":"media/e09-1-t.webp","w":360,"h":450},{"t":"vid","src":"media/e09-2.mp4","th":"media/e09-2-t.webp","w":360,"h":450},{"t":"vid","src":"media/e09-3.mp4","th":"media/e09-3-t.webp","w":360,"h":450}]},{"n":"10","s":[{"t":"vid","src":"media/e10-2.mp4","th":"media/e10-2-t.webp","w":720,"h":960},{"t":"img","src":"media/e10-1.webp","th":"media/e10-1-t.webp","w":1086,"h":1448}]},{"n":"11","s":[{"t":"img","src":"media/e11-2.webp","th":"media/e11-2-t.webp","w":1170,"h":1463},{"t":"img","src":"media/e11-1.webp","th":"media/e11-1-t.webp","w":1170,"h":1463}]},{"n":"12","s":[{"t":"img","src":"media/e12-1.webp","th":"media/e12-1-t.webp","w":1170,"h":1458}]},{"n":"13","s":[{"t":"img","src":"media/e13-1.webp","th":"media/e13-1-t.webp","w":1170,"h":1463}]},{"n":"14","s":[{"t":"img","src":"media/e14-1.webp","th":"media/e14-1-t.webp","w":872,"h":1090}]},{"n":"15","s":[{"t":"img","src":"media/e15-1.webp","th":"media/e15-1-t.webp","w":470,"h":587}]},{"n":"16","s":[{"t":"img","src":"media/e16-1.webp","th":"media/e16-1-t.webp","w":446,"h":558},{"t":"img","src":"media/e16-2.webp","th":"media/e16-2-t.webp","w":445,"h":556}]},{"n":"17","s":[{"t":"img","src":"media/e17-1.webp","th":"media/e17-1-t.webp","w":868,"h":1085}]}];
const $ = s => document.querySelector(s);
const campo = $("#campo"), velo = $("#velo"), tarjeta = $("#tarjeta");

// ── esfera ──
// Cada flyer es un punto sobre una esfera (espiral de Fibonacci). Gira sola; el mouse la dirige
// mientras se mueve y, al quedarse quieto, vuelve a girar sola. Con el dedo o clic sostenido se arrastra.
const N = EVENTOS.length, AUREO = Math.PI * (3 - Math.sqrt(5));
const flyers = EVENTOS.map((e,i) => {
  const y = 1 - (i + .5) * 2 / N, r = Math.sqrt(1 - y*y), a = i * AUREO;
  const b = document.createElement("button");
  b.className = "flyer"; b.setAttribute("aria-label", "Evento " + e.n);
  b.innerHTML = `<img src="${e.s[0].th}" width="${e.s[0].w}" height="${e.s[0].h}" alt="" draggable="false">`
    + `<span class="num">${e.n}</span>${e.s.length>1?`<span class="mas">${e.s.length}</span>`:""}`;
  b.onclick = () => { if (!huboArrastre) abrir(i); };
  campo.append(b);
  return {el: b, x: Math.cos(a)*r, y, z: Math.sin(a)*r, ar: e.s[0].h / e.s[0].w};
});

const GIRO_SOLO = .0032;                       // radianes por cuadro
let rotY = 0, rotX = -.18, velY = GIRO_SOLO, velX = 0, metaY = GIRO_SOLO, metaX = 0;
let radio = 300, ancho = 150, desfase = 0, quieto = null, arrastre = null, huboArrastre = false;

function medir(){
  const w = campo.clientWidth, h = campo.clientHeight;
  ancho = Math.max(96, Math.min(190, Math.min(w, h) * .24));
  radio = Math.max(130, Math.min(w * .5 - ancho * .45, h * .5 - ancho * .7));
  desfase = h * .04;                             // un poco más abajo, para dejar aire al título
  campo.style.setProperty("--w", ancho.toFixed(0) + "px");
}
addEventListener("resize", medir); medir();

function cuadro(){
  requestAnimationFrame(cuadro);
  if (velo.classList.contains("on")) return;
  if (!arrastre) { velY += (metaY - velY) * .05; velX += (metaX - velX) * .05; rotY += velY; rotX += velX; }
  rotX = Math.max(-1.1, Math.min(1.1, rotX));
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  for (const f of flyers) {
    const x1 = f.x*cy + f.z*sy, z1 = -f.x*sy + f.z*cy;         // giro horizontal
    const y2 = f.y*cx - z1*sx, z2 = f.y*sx + z1*cx;            // inclinación
    const p = 1 / (1.32 - z2 * .32);                           // perspectiva: lo cercano, más grande
    const alto = ancho * f.ar;
    f.el.style.transform = `translate3d(${(x1*radio*p).toFixed(1)}px,${(y2*radio*p - alto/2 + desfase).toFixed(1)}px,0) scale(${p.toFixed(3)})`;
    f.el.style.opacity = (.22 + .78 * (z2 + 1) / 2).toFixed(2);
    f.el.style.zIndex = Math.round((z2 + 1) * 100);
    f.el.style.filter = z2 < -.35 ? "blur(2px)" : "";
  }
}
cuadro();

function soltar(){ clearTimeout(quieto); quieto = setTimeout(() => { metaY = GIRO_SOLO; metaX = 0; }, 1400); }
campo.addEventListener("pointermove", ev => {
  if (arrastre) {
    const dx = ev.clientX - arrastre.x, dy = ev.clientY - arrastre.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) huboArrastre = true;
    rotY = arrastre.ry + dx * .006; rotX = arrastre.rx - dy * .006;
    velY = (ev.clientX - arrastre.ux) * .006; velX = -(ev.clientY - arrastre.uy) * .006;
    arrastre.ux = ev.clientX; arrastre.uy = ev.clientY;
    return;
  }
  if (ev.pointerType !== "mouse") return;
  const r = campo.getBoundingClientRect();
  metaY = ((ev.clientX - r.left) / r.width - .5) * .05;       // el mouse marca hacia dónde y qué tan rápido gira
  metaX = -((ev.clientY - r.top) / r.height - .5) * .03;
  soltar();
});
campo.addEventListener("pointerdown", ev => { huboArrastre = false;
  arrastre = {x: ev.clientX, y: ev.clientY, ux: ev.clientX, uy: ev.clientY, ry: rotY, rx: rotX}; campo.classList.add("arrastrando"); });
addEventListener("pointerup", () => { if (!arrastre) return; arrastre = null; campo.classList.remove("arrastrando");
  metaY = Math.abs(velY) > .001 ? Math.sign(velY) * GIRO_SOLO : GIRO_SOLO; metaX = 0; });
campo.addEventListener("pointerleave", () => { if (!arrastre) { metaY = GIRO_SOLO; metaX = 0; } });

// tarjeta
let actual = -1, idx = 0, reloj = null;
function abrir(i){
  actual = (i + EVENTOS.length) % EVENTOS.length; idx = 0;
  const e = EVENTOS[actual];
  tarjeta.querySelectorAll(".pieza").forEach(p => p.remove());
  e.s.forEach(s => {
    const el = document.createElement(s.t === "vid" ? "video" : "img");
    el.className = "pieza"; el.src = s.src; el.style.background = `#111 url("${s.th}") center/cover`;
    if (s.t === "vid") { el.muted = true; el.playsInline = true; el.preload = "auto"; el.poster = s.th; el.loop = e.s.length === 1; }
    tarjeta.prepend(el);
  });
  $("#puntos").innerHTML = e.s.length > 1 ? e.s.map((_,k)=>`<button data-k="${k}" aria-label="Pieza ${k+1}"></button>`).join("") : "";
  velo.classList.add("on"); document.body.classList.add("abierto");
  mostrar(0);
}
function mostrar(k){
  clearTimeout(reloj);
  const e = EVENTOS[actual]; idx = (k + e.s.length) % e.s.length;
  const s = e.s[idx], els = [...tarjeta.querySelectorAll(".pieza")].reverse();
  tarjeta.style.setProperty("--ar", s.w + "/" + s.h);
  els.forEach((el,j) => { el.classList.toggle("on", j === idx); if (el.tagName === "VIDEO") { if (j === idx) { el.currentTime = 0; el.play().catch(()=>{}); } else el.pause(); } });
  $("#rotulo").textContent = "EVENTO " + e.n + (e.s.length > 1 ? " · " + (idx+1) + " / " + e.s.length : "");
  if (e.s.length < 2) return;
  // las imágenes cambian cada 1 s; un video se deja terminar antes de pasar al siguiente
  const dur = s.t === "vid" ? null : 1000;
  $("#puntos").querySelectorAll("button").forEach((p,j) => { p.className = j < idx ? "hecho" : j === idx ? "on" : ""; });
  const punto = $("#puntos").children[idx];
  if (dur) { punto.style.setProperty("--t", "1s"); reloj = setTimeout(() => mostrar(idx+1), dur); }
  else { const v = els[idx]; const listo = () => { punto.style.setProperty("--t", (v.duration||15) + "s"); punto.className = ""; void punto.offsetWidth; punto.className = "on"; };
    v.readyState >= 1 ? listo() : v.addEventListener("loadedmetadata", listo, {once:true});
    v.onended = () => mostrar(idx+1); }
}
function cerrar(){
  clearTimeout(reloj); velo.classList.remove("on"); document.body.classList.remove("abierto");
  tarjeta.querySelectorAll("video").forEach(v => v.pause());
  tarjeta.style.cssText = ""; actual = -1;
}
velo.onclick = ev => { if (ev.target === velo) cerrar(); };
$("#cerrar").onclick = cerrar;
$("#ant").onclick = () => abrir(actual-1);
$("#sig").onclick = () => abrir(actual+1);
$("#puntos").onclick = ev => { const k = ev.target.dataset.k; if (k !== undefined) mostrar(+k); };
tarjeta.onclick = () => { if (EVENTOS[actual].s.length > 1) mostrar(idx+1); };
addEventListener("keydown", ev => {
  if (actual < 0) return;
  if (ev.key === "Escape") cerrar();
  if (ev.key === "ArrowRight") abrir(actual+1);
  if (ev.key === "ArrowLeft") abrir(actual-1);
});

// precarga: al abrir cualquier evento, sus imágenes ya están en caché
addEventListener("load", () => { const cola = EVENTOS.flatMap(e => e.s.filter(s => s.t === "img").map(s => s.src));
  (function sig(){ const u = cola.shift(); if (!u) return; const im = new Image(); im.onload = im.onerror = sig; im.src = u; })(); });

// enlace directo a un evento: index.html#e05
if (/^#e\d+$/.test(location.hash)) abrir(+location.hash.slice(2)-1);

// inclinación 3D al pasar el mouse
tarjeta.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse") return;
  const r = tarjeta.getBoundingClientRect(), x = (ev.clientX-r.left)/r.width, y = (ev.clientY-r.top)/r.height;
  tarjeta.style.setProperty("--ry", ((x-.5)*16).toFixed(2) + "deg");
  tarjeta.style.setProperty("--rx", ((.5-y)*12).toFixed(2) + "deg");
  tarjeta.style.setProperty("--gx", (x*100).toFixed(0) + "%"); tarjeta.style.setProperty("--gy", (y*100).toFixed(0) + "%");
  tarjeta.style.setProperty("--go", ".8");
});
tarjeta.addEventListener("pointerleave", () => { tarjeta.style.setProperty("--rx","0deg"); tarjeta.style.setProperty("--ry","0deg"); tarjeta.style.setProperty("--go","0"); });
</script>
</body>
</html>
